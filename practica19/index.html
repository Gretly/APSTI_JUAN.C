<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Card - Hinata</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="zona-hover">
        
        <!-- Avatar pequeño (El que activa la tarjeta) -->
        <div class="contenedor-avatar-hover">
            <!-- Tu imagen 1 -->
            <img src="profile1.jpeg" alt="Shoyo Hinata" class="avatar-pequeno">
        </div>

        <!-- LA TARJETA FLOTANTE -->
        <div class="tarjeta-hover">
            
            <!-- Cabecera -->
            <div class="tarjeta-cabecera">
                <img src="profile1.jpeg" alt="Shoyo Hinata" class="avatar-grande">
                <button class="btn-seguir">Seguir</button>
            </div>

            <!-- Info del usuario (Datos de Hinata) -->
            <div class="tarjeta-info">
                <h3>Shoyo Hinata</h3>
                <span class="usuario">@shoyo_karasuno</span>
            </div>

            <!-- Biografía de Hinata -->
            <p class="biografia">
                El pequeño gigante 🏐. Bloqueador central de Karasuno. Si no puedo ganar solo, ¡tengo que confiar en mi equipo! ☀️🧡
            </p>

            <!-- Estadísticas (Ajustadas a sus seguidores) -->
            <div class="estadisticas">
                <span><strong>10k</strong> Siguiendo</span>
                <span><strong>1.2M</strong> Seguidores</span>
            </div>

            <!-- Amigos en común (Cambiados por sus compañeros) -->
            <div class="amigos-comun">
                <div class="mini-avatares">
                    <!-- Reemplaza estos src por las imágenes de tus amigos si las tienes -->
                    <img src="profile2.jpeg" alt="Kageyama">
                    <img src="profile3.jpeg" alt="Kiyoko">
                    <img src="profile1.jpeg" alt="Amigo 3">
                </div>
                <p>Tobio Kageyama, Kiyoko Shimizu y 15 más de las cuentas que sigues siguen a esta cuenta.</p>
            </div>

        </div>

    </div>

</body>
