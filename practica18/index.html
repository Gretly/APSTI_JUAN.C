<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider con Imágenes Locales</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="slider-container">
        
        <div class="slider-track">
            
            <!-- Slide 1 -->
            <div class="slide" id="slide-1">
                <!-- PON AQUÍ TU IMAGEN -->
                <img src="profile11.jpeg" alt="Imagen 1" class="slide-img">
                <div class="slide-content">
                    <h2>Bienvenido</h2>
                    <p>El comienzo de una gran aventura</p>
                </div>
            </div>

            <!-- Slide 2 -->
            <div class="slide" id="slide-2">
                <!-- PON AQUÍ TU IMAGEN -->
                <img src="profile12.jpeg" alt="Imagen 2" class="slide-img">
                <div class="slide-content">
                    <h2>Entrenamiento</h2>
                    <p>Supera tus propios límites</p>
                </div>
            </div>

            <!-- Slide 3 -->
            <div class="slide" id="slide-3">
                <!-- PON AQUÍ TU IMAGEN -->
                <img src="profile13.jpeg" alt="Imagen 3" class="slide-img">
                <div class="slide-content">
                    <h2>El Partido</h2>
                    <p>Todo o nada en la cancha</p>
                </div>
            </div>

            <!-- Slide 4 -->
            <div class="slide" id="slide-4">
                <!-- PON AQUÍ TU IMAGEN (la cuarta que tengas) -->
                <img src="profile14.jpeg" alt="Imagen 4" class="slide-img">
                <div class="slide-content">
                    <h2>La Victoria</h2>
                    <p>El esfuerzo siempre tiene recompensa</p>
                </div>
            </div>

        </div>

        <!-- Controles de navegación -->
        <div class="slider-nav">
            <a href="#slide-1" class="nav-btn">1</a>
            <a href="#slide-2" class="nav-btn">2</a>
            <a href="#slide-3" class="nav-btn">3</a>
            <a href="#slide-4" class="nav-btn">4</a>
        </div>

    </div>

</body>
</html>
