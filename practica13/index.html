<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de Logros Desplegable</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="menu-logros">
        
        <!-- Perfil del usuario (Arriba) -->
        <div class="perfil">
            <div class="contenedor-avatar">
                 <img src="profile3.jpeg" alt="Perfil">
            </div>
        </div>

        <!-- Lista de Logros (Iconos) -->
        <nav class="navegacion">
            
            <a href="#" class="logro-item">
                <i class="fa-solid fa-trophy icono-oro"></i>
                <span class="nombre-logro">Primer Torneo</span>
            </a>

            <a href="#" class="logro-item">
                <i class="fa-solid fa-medal icono-plata"></i>
                <span class="nombre-logro">Subcampeón Regional</span>
            </a>

            <a href="#" class="logro-item">
                <i class="fa-solid fa-fire icono-fuego"></i>
                <span class="nombre-logro">Racha de 10 Victorias</span>
            </a>

            <a href="#" class="logro-item">
                <i class="fa-solid fa-bolt icono-rayo"></i>
                <span class="nombre-logro">Mejor Saque del Año</span>
            </a>

            <a href="#" class="logro-item">
                <i class="fa-solid fa-crown icono-corona"></i>
                <span class="nombre-logro">Rey de la Cancha</span>
            </a>

        </nav>
    </div>

</body>
</html>
