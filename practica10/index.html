<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipo de Vóley - Flip Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contenedor que agrupa las 3 tarjetas -->
    <div class="contenedor-equipo">

        <!-- TARJETA 1 -->
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <!-- Usa tu imagen local -->
                    <img src="profile1.jpeg" alt="Jugador 1">
                    <div class="etiqueta-numero">#1</div>
                </div>
                <div class="flip-card-back">
                    <h2>Shoyo Hinata</h2>
                    <p class="equipo">Karasuno High</p>
                    <div class="estadisticas">
                        <div class="stat"><span class="titulo-stat">Posición</span><span class="valor-stat">Bloqueador</span></div>
                        <div class="stat"><span class="titulo-stat">Altura</span><span class="valor-stat">162 cm</span></div>
                        <div class="stat"><span class="titulo-stat">Salto</span><span class="valor-stat">333 cm</span></div>
                    </div>
                    <p class="frase">"¡El pequeño gigante!"</p>
                </div>
            </div>
        </div>

        <!-- TARJETA 2 -->
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <img src="profile2.jpeg" alt="Jugador 2">
                    <div class="etiqueta-numero">#2</div>
                </div>
                <div class="flip-card-back">
                    <h2>Tobio Kageyama</h2>
                    <p class="equipo">Karasuno High</p>
                    <div class="estadisticas">
                        <div class="stat"><span class="titulo-stat">Posición</span><span class="valor-stat">Colocador</span></div>
                        <div class="stat"><span class="titulo-stat">Altura</span><span class="valor-stat">180 cm</span></div>
                        <div class="stat"><span class="titulo-stat">Salto</span><span class="valor-stat">337 cm</span></div>
                    </div>
                    <p class="frase">"El Rey de la Cancha"</p>
                </div>
            </div>
        </div>

        <!-- TARJETA 3 -->
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <img src="profile3.jpeg" alt="Jugador 3">
                    <div class="etiqueta-numero">#3</div>
                </div>
                <div class="flip-card-back">
                    <h2>Kiyoko Shimizu</h2>
                    <p class="equipo">Karasuno High</p>
                    <div class="estadisticas">
                        <div class="stat"><span class="titulo-stat">Posición</span><span class="valor-stat">Mánager</span></div>
                        <div class="stat"><span class="titulo-stat">Año</span><span class="valor-stat">Tercero</span></div>
                        <div class="stat"><span class="titulo-stat">Rol</span><span class="valor-stat">Apoyo</span></div>
                    </div>
                    <p class="frase">"La belleza del equipo"</p>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
