<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Neón - Práctica 15</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fondo oscuro -->
    <div class="overlay">
        
        <!-- Tarjeta Modal -->
        <div class="modal">
            
            <div class="modal-header">
                <!-- Contenedor del icono para darle el fondo circular -->
                <div class="icono-contenedor">
                    <!-- Tu archivo SVG local -->
                    <img src="check-svgrepo-com.svg" alt="Check" class="icono-check">
                </div>
                
                <div class="textos">
                    <h2>Creación de un nuevo elemento</h2>
                    <p>¿Deseas confirmar los cambios?</p>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-cancelar">Cancelar</button>
                <button class="btn-crear">Crear elemento</button>
            </div>

        </div>

    </div>

</body>
</html>
